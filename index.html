<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="A rotating 3D Christmas tree with lights and snow — christmas-tree-v17.6">
<title>Merry Christmas · christmas-tree-v17.6</title>
<style>
  :root{ --gold:#f7d899; --gold-2:#c99a4e; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; }
  body{
    background:
      radial-gradient(60% 45% at 50% 76%, rgba(40,80,130,.30), rgba(0,0,0,0) 70%),
      radial-gradient(120% 100% at 50% 0%, #0b1524 0%, #060a13 45%, #02040a 100%);
    overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color:#fff;
    -webkit-tap-highlight-color:transparent;
  }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.45) 100%);
  }
  header{
    position:fixed; top:0; left:0; right:0; z-index:3;
    padding:18px 22px; display:flex; justify-content:space-between; align-items:center;
    pointer-events:none;
  }
  .brand{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.42); }
  #toggle{
    pointer-events:auto; cursor:pointer;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    color:rgba(255,255,255,.8); font-size:12px; letter-spacing:.12em;
    padding:8px 15px; border-radius:999px; transition:.25s;
  }
  #toggle:hover{ background:rgba(255,255,255,.14); color:#fff; }
  .caption{ position:fixed; left:0; right:0; bottom:max(4.5vh, 26px); z-index:2; text-align:center; pointer-events:none; }
  .caption h1{
    font-family:"Didot","Baskerville","Times New Roman",Georgia,serif;
    font-weight:400; letter-spacing:.2em; text-indent:.2em;
    font-size:clamp(26px, 4.6vw, 62px);
    background:linear-gradient(180deg,#fff8e1 0%, var(--gold) 45%, var(--gold-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,214,140,.35));
  }
  .caption p{
    margin-top:10px; font-size:clamp(11px,1.1vw,14px); letter-spacing:.34em; text-indent:.34em;
    color:rgba(255,255,255,.58);
  }
  .hint{
    position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:2;
    font-size:11px; letter-spacing:.14em; color:rgba(255,255,255,.3);
    transition:opacity .8s; pointer-events:none;
  }
  .hint.off{ opacity:0; }
  @media (max-width:560px){ .brand{ font-size:10px; letter-spacing:.18em; } }
  @media (prefers-reduced-motion: reduce){ .caption h1{ filter:none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<header>
  <span class="brand">christmas-tree-v17.6</span>
  <button id="toggle" type="button">暂停</button>
</header>
<div class="caption">
  <h1>Merry Christmas</h1>
  <p id="count">圣诞快乐</p>
</div>
<div class="hint" id="hint">拖动旋转 · 双击暂停</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;
  var FOCAL = 1250;      // 透视焦距
  var TREE_H = 600;      // 树高（世界坐标）
  var TREE_R = 205;      // 底部半径

  var W = 0, H = 0, cx = 0, baseY = 0, zoom = 1, DPR = 1;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------------- 光晕贴图缓存 ---------------- */
  var spriteCache = new Map();
  function toRGB(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function glowSprite(hex) {
    if (spriteCache.has(hex)) return spriteCache.get(hex);
    var S = 128, c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    var r = toRGB(hex);
    var grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grd.addColorStop(0, 'rgba(255,255,255,0.96)');
    grd.addColorStop(0.16, 'rgba(' + r[0] + ',' + r[1] + ',' + r[2] + ',0.90)');
    grd.addColorStop(0.38, 'rgba(' + r[0] + ',' + r[1] + ',' + r[2] + ',0.30)');
    grd.addColorStop(1, 'rgba(' + r[0] + ',' + r[1] + ',' + r[2] + ',0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(S / 2, S / 2, S / 2, 0, TAU);
    g.fill();
    spriteCache.set(hex, c);
    return c;
  }

  /* ---------------- 场景数据 ---------------- */
  var points = [];    // kind 0 = 树体/树干, 1 = 彩灯/挂饰
  var vis = [];
  var bgStars = [];
  var farSnow = [], nearSnow = [];
  var LIGHT_COLORS = ['#ffd479', '#fff3c9', '#ff9a6b', '#7fe3ff', '#ff6495', '#a8ff8f', '#ffc23d', '#c9a4ff'];

  function buildTree() {
    points.length = 0;

    // 树体点云
    for (var i = 0; i < 1700; i++) {
      var t = 1 - Math.sqrt(Math.random());                 // 越靠底部越密
      var rMax = TREE_R * Math.pow(1 - t, 1.06) + 1.5;
      var surface = Math.random() < 0.62;
      var rad = surface ? rMax * rand(0.86, 1) : rMax * Math.sqrt(Math.random());
      var ang = Math.random() * TAU;
      var hue = rand(104, 148), sat = rand(36, 70), lig = 14 + (rad / TREE_R) * 22 + rand(0, 8);
      points.push({
        x: Math.cos(ang) * rad, y: t * TREE_H, z: Math.sin(ang) * rad,
        size: rand(0.9, 2.1),
        color: 'hsl(' + hue.toFixed(0) + ',' + sat.toFixed(0) + '%,' + lig.toFixed(0) + '%)',
        kind: 0
      });
    }

    // 树干
    for (var s = 0; s < 90; s++) {
      var ta = Math.random() * TAU, trad = rand(0, 13);
      points.push({
        x: Math.cos(ta) * trad, y: rand(-26, 26), z: Math.sin(ta) * trad,
        size: rand(1.4, 2.6),
        color: 'hsl(28,26%,' + rand(12, 22).toFixed(0) + '%)',
        kind: 0
      });
    }

    // 螺旋彩灯
    var LIGHTS = 270;
    for (var j = 0; j < LIGHTS; j++) {
      var tt = 0.03 + (j / (LIGHTS - 1)) * 0.92;
      var lAng = tt * TAU * 9 + 0.35;
      var lr = TREE_R * (1 - tt) + 2;
      points.push({
        x: Math.cos(lAng) * lr, y: tt * TREE_H, z: Math.sin(lAng) * lr,
        size: rand(1.5, 2.6),
        color: LIGHT_COLORS[j % LIGHT_COLORS.length],
        phase: Math.random() * TAU, kind: 1
      });
    }

    // 挂饰小球
    for (var k = 0; k < 16; k++) {
      var t2 = rand(0.05, 0.92), a2 = Math.random() * TAU;
      var rr = TREE_R * (1 - t2) * rand(0.9, 1);
      points.push({
        x: Math.cos(a2) * rr, y: t2 * TREE_H, z: Math.sin(a2) * rr,
        size: rand(4.2, 6),
        color: LIGHT_COLORS[(k * 3) % LIGHT_COLORS.length],
        phase: Math.random() * TAU, kind: 1
      });
    }

    vis = points.map(function () {
      return { sx: 0, sy: 0, z: 0, p: 1, size: 0, color: '#000', kind: 0, b: 1 };
    });
  }

  function buildBg() {
    bgStars = [];
    for (var i = 0; i < 110; i++) {
      bgStars.push({ nx: Math.random(), ny: Math.random() * 0.72, r: rand(0.5, 1.7), phase: Math.random() * TAU });
    }
  }

  function newFlake(far) {
    var r = far ? rand(0.4, 1.1) : rand(1.5, 3);
    return {
      x: Math.random() * W, y: Math.random() * H, r: r,
      vy: far ? rand(8, 22) / (r + 0.6) : rand(24, 52) / (r + 0.6),
      sway: far ? rand(0.2, 0.7) : rand(0.5, 1.4),
      phase: Math.random() * TAU,
      a: far ? rand(0.2, 0.45) : rand(0.5, 0.9)
    };
  }
  function buildSnow() {
    farSnow = []; nearSnow = [];
    var n1 = clamp(Math.round(W * H / 26000), 40, 150);
    var n2 = clamp(Math.round(W * H / 70000), 10, 60);
    for (var i = 0; i < n1; i++) farSnow.push(newFlake(true));
    for (var j = 0; j < n2; j++) nearSnow.push(newFlake(false));
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    zoom = clamp(Math.min(W / 580, H / 900), 0.34, 1.45);
    cx = W / 2;
    baseY = H * 0.81;

    buildSnow();
  }

  /* ---------------- 绘制 ---------------- */
  function drawGround() {
    var R = Math.max(320, 300 * zoom);
    ctx.save();
    ctx.translate(cx, baseY + 6 * zoom);
    ctx.scale(1, 0.28);
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, 'rgba(150,200,240,0.26)');
    g.addColorStop(0.35, 'rgba(90,140,200,0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawSnow(list, mul) {
    ctx.fillStyle = '#eaf6ff';
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      ctx.globalAlpha = f.a * mul;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawStar() {
    var sx = cx;
    var sy = baseY - (TREE_H + 26) * zoom;
    var pulse = 0.86 + 0.14 * Math.sin(time * 2.4);

    ctx.globalCompositeOperation = 'lighter';
    var G = 170 * zoom * pulse;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(glowSprite('#fff3cf'), sx - G / 2, sy - G / 2, G, G);

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(Math.sin(time * 0.6) * 0.14);
    var R1 = 36 * zoom * pulse, R2 = R1 * 0.15;
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4 - Math.PI / 2;
      var rr = (i % 2 === 0) ? R1 : R2;
      var x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    var grd = ctx.createRadialGradient(0, 0, 0, 0, 0, R1);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.42, 'rgba(255,238,180,0.95)');
    grd.addColorStop(1, 'rgba(255,200,90,0.12)');
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.restore();

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // 背景星
    ctx.fillStyle = '#cfe6ff';
    for (var i = 0; i < bgStars.length; i++) {
      var st = bgStars[i];
      ctx.globalAlpha = 0.16 + 0.4 * (0.5 + 0.5 * Math.sin(time * 1.3 + st.phase));
      ctx.beginPath();
      ctx.arc(st.nx * W, st.ny * H, st.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawGround();
    drawSnow(farSnow, 0.55);

    // 投影
    var cs = Math.cos(rot), sn = Math.sin(rot);
    for (var p = 0; p < points.length; p++) {
      var pt = points[p], v = vis[p];
      var px = pt.x * cs - pt.z * sn;
      var pz = pt.x * sn + pt.z * cs;
      var persp = FOCAL / (FOCAL + pz);
      v.sx = cx + px * persp * zoom;
      v.sy = baseY - pt.y * persp * zoom;
      v.z = pz;
      v.p = persp;
      v.size = pt.size * persp * zoom;
      v.color = pt.color;
      v.kind = pt.kind;
      if (pt.kind === 1) {
        var tw = 0.5 + 0.5 * Math.sin(time * 2.2 + pt.phase);
        v.b = (0.4 + 0.6 * tw) * (0.75 + 0.35 * persp) * (1 - clamp(pz / 900, 0, 0.55));
      }
    }
    vis.sort(function (a, b) { return b.z - a.z; });   // 远的先画

    // 树体
    for (var q = 0; q < vis.length; q++) {
      var d = vis[q];
      if (d.kind !== 0) continue;
      ctx.globalAlpha = clamp(0.45 + 0.55 * ((d.p - 0.8) / 0.45), 0.4, 1);
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.arc(d.sx, d.sy, Math.max(0.6, d.size), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 彩灯（叠加发光）
    ctx.globalCompositeOperation = 'lighter';
    for (var m = 0; m < vis.length; m++) {
      var l = vis[m];
      if (l.kind !== 1) continue;
      var G2 = l.size * 7 * (0.8 + 0.5 * l.b);
      ctx.globalAlpha = clamp(0.3 + 0.85 * l.b, 0, 1);
      ctx.drawImage(glowSprite(l.color), l.sx - G2 / 2, l.sy - G2 / 2, G2, G2);
      ctx.globalAlpha = clamp(0.45 + 0.6 * l.b, 0, 1);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(l.sx, l.sy, Math.max(0.7, l.size * 0.5), 0, TAU);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    drawStar();
    drawSnow(nearSnow, 1);
  }

  function updateSnow(dt) {
    if (dt <= 0) return;
    for (var k = 0; k < 2; k++) {
      var list = k === 0 ? farSnow : nearSnow;
      for (var i = 0; i < list.length; i++) {
        var f = list[i];
        f.y += f.vy * dt;
        f.x += Math.sin(time * 0.8 + f.phase) * f.sway * 12 * dt;
        if (f.y > H + 8) { f.y = -8; f.x = Math.random() * W; }
        if (f.x < -14) f.x = W + 12;
        else if (f.x > W + 14) f.x = -12;
      }
    }
  }

  /* ---------------- 动画循环 ---------------- */
  var rot = 0, spin = 0.32, BASE_SPIN = 0.32, time = 0;
  var paused = false, dragging = false, lastPointerX = 0, lastTs = 0;

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!lastTs) { lastTs = ts; return; }
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    if (paused) dt = 0;

    if (!dragging) spin = spin * 0.94 + BASE_SPIN * 0.06;
    rot += spin * dt;
    time += dt;

    updateSnow(dt);
    render();
  }

  /* ---------------- 交互 ---------------- */
  var hint = document.getElementById('hint');
  var toggle = document.getElementById('toggle');

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    lastPointerX = e.clientX;
    spin = 0;
    if (hint) hint.classList.add('off');
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastPointerX;
    lastPointerX = e.clientX;
    rot += dx * 0.008;
    spin = clamp(dx * 0.06, -1.6, 1.6);
  });

  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', function () { if (dragging) endDrag(); });

  function togglePause() {
    paused = !paused;
    toggle.textContent = paused ? '继续' : '暂停';
  }
  toggle.addEventListener('click', togglePause);
  canvas.addEventListener('dblclick', togglePause);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  /* ---------------- 倒计时 ---------------- */
  function setCountdown() {
    var now = new Date();
    var year = now.getFullYear();
    var xmas = new Date(year, 11, 25, 0, 0, 0);
    if (now.getTime() >= new Date(year, 11, 26, 0, 0, 1).getTime()) {
      year += 1;
      xmas = new Date(year, 11, 25, 0, 0, 0);
    }
    var days = Math.ceil((xmas.getTime() - now.getTime()) / 86400000);
    var el = document.getElementById('count');
    el.textContent = days > 0 ? '距离 ' + year + ' 圣诞还有 ' + days + ' 天' : '圣诞快乐 🎄';
  }

  /* ---------------- 启动 ---------------- */
  buildTree();
  buildBg();
  resize();
  setCountdown();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
